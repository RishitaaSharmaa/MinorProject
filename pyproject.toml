[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionwatch"
version = "0.1.0"
description = "Decision rationale monitoring for SME procurement"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.110",
    "groq>=0.9",
    "pandas>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*", "llm*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]