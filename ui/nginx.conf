server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API: the browser calls /api/*, nginx forwards to the backend.
  location /api/ {
    proxy_pass http://app:8000/;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  # Single-page app: unknown paths (e.g. /console) fall back to index.html.
  location / {
    try_files $uri /index.html;
  }
}
