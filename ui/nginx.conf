server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;

  # Same-origin API: the browser calls /api/*, nginx forwards to the backend.
  location /api/ {
    proxy_pass http://app:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }

  # The in-browser engine loads Pyodide as an ES module, which browsers only accept with a JS type.
  location ~* \.mjs$ {
    default_type application/javascript;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # Large engine files: let the browser keep them.
  location /engine/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # Single-page app: unknown paths (e.g. /console) fall back to index.html.
  location / {
    try_files $uri /index.html;
  }
}
