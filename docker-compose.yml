services:
  db:
    image: postgres:16-alpine
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-decisionwatch}:${POSTGRES_PASSWORD:-decisionwatch_dev}@db:5432/${POSTGRES_DB:-decisionwatch}
      LLM_MODEL: ${DECISIONWATCH_LLM_MODEL:-openai/gpt-oss-20b}
      NOTE_LLM_MODEL: ${DECISIONWATCH_NOTE_LLM_MODEL:-openai/gpt-oss-120b}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: